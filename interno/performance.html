<body class="dash pg-performance" data-pagina="performance" data-modo="interno" data-titulo="Dashboard de marketing">
<main>

  <div class="linha-topo">
    <div class="filtros-topo">
      <div class="filtros">
        <div class="campo"><label for="fCurso">Curso</label><select id="fCurso"></select></div>
        <div class="campo"><label for="fCampanha">Campanha</label><select id="fCampanha"></select></div>
        <div class="campo"><label for="fPeriodo">Período</label><select id="fPeriodo">
          <option value="campanha">Campanha inteira</option>
          <option value="mes">Mês atual</option>
          <option value="mesant">Mês anterior</option>
          <option value="livre">Datas livres</option>
        </select></div>
        <div class="campo oculto" id="campoIni"><label for="fIni">De</label><input type="date" id="fIni"></div>
        <div class="campo oculto" id="campoFim"><label for="fFim">até</label><input type="date" id="fFim"></div>
        <div class="campo"><label for="fCorte" title="Reproduz a leitura como ela estava naquele dia. Vazio significa o dado mais recente.">Leitura em</label><input type="date" id="fCorte"></div>
      </div>
    </div>
    <div class="acoes"><span class="tag" id="atualizado"></span><button class="chip" id="btnPdf" title="Gera um PDF pelo diálogo de impressão"><span class="ms">picture_as_pdf</span>Salvar PDF</button></div>
  </div>

  <div class="printhead" id="printhead"><h2 id="ph-titulo"></h2><div id="ph-sub"></div></div>

  <div id="aviso"></div>

  <div class="card card-grafico">
    <div id="grafico"><div class="skel"><i></i><i></i><i></i><i></i></div></div>
  </div>


  <div class="rodape">
    <div>Versão interna. Consultado às <span id="horaRodape"></span>.</div>
    <span class="credito"><svg><use href="#anel"/></svg>por Communitas</span>
  </div>
</main>

<script>window.AGUARDA_PIN = true; window.SEM_NITA = true;</script>
